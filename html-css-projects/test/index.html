<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <h1>Weather Now</h1>
            <button class="unit-btn">Units</button>
        </nav> 
    </header>
    <main>
        <h1 class="tittle">How's  the sky looking today?</h1>
        <div class="input-container">
            <input type="text" placeholder="Seach for place.."/>
            <button class="search-btn">Search</button>
        </div>
        <div class="container">
            <div class="first-container">
              <div class="child-container1">
                
              </div>  
              <div class="child-container2">
                <div class="grand-child1">
                    <p>Feels Like</p>
                    <p>64</p>
                </div>
                <div class="grand-child2">
                    <p>Humidity</p>
                    <p>46%</p>
                </div>
                <div class="grand-child3">
                    <p>Wind</p>
                    <p>9 mph</p>
                </div>
                <div class="grand-child4">
                    <p>Precipitation</p>
                    <p>0 in</p>
                </div>
              </div>
              <div class="child-container3">
                <h4>Daily forcast</h4>
                <div class="days">
                    <p class="day">Sun</p>
                    <p class="day">Mon</p>
                    <p class="day">Tue</p>
                    <p class="day">Wed</p>
                    <p class="day">Thur</p>
                    <p class="day">Fri</p>
                    <p class="day">Sat</p>
                </div>
              </div>
            </div>
            <div class="second-container">
                <div class="tittles">
                    <h4>Hourly forecast</h4>
                    <button>Tuesday ^</button>
                </div>
                <div class="times">
                    <p class="time">3PM</p>
                    <p class="time">4PM</p>
                    <p class="time">5PM</p>
                    <p class="time">6PM</p>
                    <p class="time">7PM</p>
                    <p class="time">8PM</p>
                    <p class="time">9PM</p>
                    <p class="time">10PM</p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
